name: Java architecture practice

on:
  push:
    branches: [main, modulo-01-arquitetura]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile, test and run practice
        shell: pwsh
        run: ./pratica/clean-architecture/verificar.ps1
